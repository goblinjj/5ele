<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="manifest" href="/manifest.json" />
  <title>无极</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d1117;
      overflow: hidden;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* 全屏背景装饰 */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 40% 50% at 15% 30%, rgba(28, 33, 40, 0.6) 0%, transparent 60%),
        radial-gradient(ellipse 35% 45% at 85% 70%, rgba(28, 33, 40, 0.5) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 90%, rgba(28, 33, 40, 0.4) 0%, transparent 50%),
        radial-gradient(ellipse 30% 35% at 75% 20%, rgba(28, 33, 40, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse 25% 30% at 25% 80%, rgba(28, 33, 40, 0.4) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    /* 游戏容器 - 绝对居中 */
    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    /* 确保 canvas 居中 */
    #game-container canvas {
      display: block;
      margin: auto;
    }

    /* 竖屏提示遮罩 */
    #orientation-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(13, 17, 23, 0.98);
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    #orientation-overlay .icon {
      font-size: 64px;
      animation: rotate-phone 1.5s ease-in-out infinite;
    }

    @keyframes rotate-phone {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-90deg); }
    }

    #orientation-overlay .title {
      font-size: 24px;
      color: #f0e6d3;
      font-weight: bold;
    }

    #orientation-overlay .subtitle {
      font-size: 14px;
      color: #8b949e;
    }

    /* 仅在触屏设备横屏时提示；桌面浏览器窗口通常是横向的，直接居中显示竖屏画面 */
    @media screen and (orientation: landscape) and (pointer: coarse) {
      #orientation-overlay {
        display: flex;
      }
    }

    /* 启动加载画面：脚本与图集下载期间显示，由 BootScene 更新进度并移除 */
    #splash {
      position: fixed; inset: 0; z-index: 9000;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 42%, #14222a 0%, #070b0f 70%);
      color: #f0e6d3;
      font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
      transition: opacity 0.5s ease;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .taiji {
      width: 96px; height: 96px; border-radius: 50%;
      border: 2px solid rgba(212,168,83,0.8);
      background:
        radial-gradient(circle at 50% 25%, #0e141a 0 7%, transparent 7.5%),
        radial-gradient(circle at 50% 75%, #d6e2e0 0 7%, transparent 7.5%),
        radial-gradient(circle at 50% 25%, #d6e2e0 0 25%, transparent 25.5%),
        radial-gradient(circle at 50% 75%, #0e141a 0 25%, transparent 25.5%),
        linear-gradient(90deg, #0e141a 50%, #d6e2e0 50%);
      box-shadow: 0 0 40px rgba(159,216,255,0.25);
      animation: splash-spin 6s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    #splash .name { margin-top: 36px; font-size: 56px; font-weight: bold; letter-spacing: 0.3em; text-indent: 0.3em; }
    #splash .bar {
      margin-top: 40px; width: min(62vw, 300px); height: 6px; border-radius: 3px;
      background: rgba(255,255,255,0.08); overflow: hidden;
      box-shadow: 0 0 0 1px rgba(212,168,83,0.35);
    }
    #splash .fill {
      width: 4%; height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #8a6a2c, #ffe9a8);
      transition: width 0.25s ease;
    }
    #splash .tip { margin-top: 16px; font-size: 14px; color: #8b949e; letter-spacing: 0.1em;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <!-- 启动加载画面 -->
  <div id="splash">
    <div class="taiji"></div>
    <div class="name">无极</div>
    <div class="bar"><div class="fill" id="splash-fill"></div></div>
    <div class="tip" id="splash-tip">唤醒本源… 0%</div>
  </div>

  <!-- 竖屏提示 -->
  <div id="orientation-overlay">
    <div class="icon">📱</div>
    <div class="title">请竖屏游玩</div>
    <div class="subtitle">旋转您的设备以获得最佳体验</div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
