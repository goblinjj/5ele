<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// 渲染页：由 render.mjs 驱动。先 setup(配置) 载入模型与动作，再逐帧 pose() + 画进图集画布。
const SS = 2; // 超采样倍数
let renderer, scene, cam, root, mixer, hips, bones = {}, actions = {}, cfg, current;
const loader = new FBXLoader();

window.setup = async (c) => {
  cfg = c;
  const px = c.cell * SS;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(px, px); renderer.setClearColor(0x000000, 0);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene();
  const L = c.light || 1;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x4a4250, 2.0 * L));
  const key = new THREE.DirectionalLight(0xfff0d8, 2.4 * L); scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fd0ff, 1.8 * L); scene.add(rim);

  root = await loader.loadAsync(c.base + c.skin);
  const norm = n => n.replace(/^mixamorig\d*:?/, '');
  const maps = [];
  root.traverse(o => {
    if (o.isBone) bones[norm(o.name)] = o;
    if (o.isMesh) {
      o.frustumCulled = false;
      for (const m of [].concat(o.material)) { m.shininess = 8; if (m.specular) m.specular.setScalar(0.12); if (m.map) maps.push(m.map); }
    }
  });
  scene.add(root);
  mixer = new THREE.AnimationMixer(root);
  // 动作文件来自另一个角色（同一套 Mixamo 骨架）：按骨骼名对上，髋部位移按两边的髋高比例缩放
  const hipY = bones.Hips.position.y;
  const clips = {};
  for (const def of Object.values(c.clips)) {
    if (clips[def.file]) continue;
    const g = await loader.loadAsync(c.base + def.file);
    let srcHip = hipY;
    g.traverse(o => { if (o.isBone && norm(o.name) === 'Hips') srcHip = o.position.y; });
    const clip = g.animations.find(a => a.tracks.length);
    const k = hipY / srcHip;
    clip.tracks = clip.tracks.filter(t => {
      const dot = t.name.lastIndexOf('.');
      const bone = bones[norm(t.name.slice(0, dot))];
      if (!bone) return false;
      const prop = t.name.slice(dot);
      if (prop === '.position') { if (bone !== bones.Hips) return false; t.values = t.values.map(v => v * k); }
      if (prop === '.scale') return false;
      t.name = bone.name + prop;
      return true;
    });
    clips[def.file] = clip;
  }
  for (const [f, clip] of Object.entries(clips)) actions[f] = mixer.clipAction(clip);
  // 内嵌贴图是异步解码的，等它们都就绪再出图
  for (let i = 0; i < 200 && maps.some(m => !(m.image && m.image.width)); i++) await new Promise(r => setTimeout(r, 50));
  maps.forEach(m => { m.needsUpdate = true; });

  hips = bones.Hips;
  root.updateMatrixWorld(true);
  // 模型身高（模型单位）：没配就取 T 字站姿的头顶
  const H = c.height || (bones.HeadTop_End ? bones.HeadTop_End.getWorldPosition(new THREE.Vector3()).y : bones.Head.getWorldPosition(new THREE.Vector3()).y * 1.14);
  cfg.height = H;
  const half = H * c.zoom;      // 画面半高
  cam = new THREE.OrthographicCamera(-half, half, half, -half, 1, H * 40);
  const yaw = c.yaw * Math.PI / 180, pitch = c.pitch * Math.PI / 180, d = H * 10;
  const ctr = new THREE.Vector3(0, H * c.centerY, 0);
  cam.position.set(ctr.x + Math.sin(yaw) * Math.cos(pitch) * d, ctr.y + Math.sin(pitch) * d, ctr.z + Math.cos(yaw) * Math.cos(pitch) * d);
  cam.lookAt(ctr); cam.updateMatrixWorld(true);
  key.position.copy(cam.position).add(new THREE.Vector3(H * 3, H * 8, 0));
  rim.position.set(-cam.position.x, H * 4, -cam.position.z);
  window.sheet = document.createElement('canvas');
  return { height: H, names: Object.keys(bones).slice(0, 6), durations: Object.fromEntries(Object.entries(clips).map(([f, cl]) => [f, cl.duration])), bones: Object.keys(bones).length, maps: maps.map(m => [m.image && m.image.width, m.image && m.image.height]) };
};

const v = new THREE.Vector3(), a = new THREE.Vector3(), b = new THREE.Vector3();
function screen(p) { // 世界坐标 → 单元格内像素（原点在左上）
  v.copy(p).project(cam);
  return [(v.x * 0.5 + 0.5) * cfg.cell, (-v.y * 0.5 + 0.5) * cfg.cell];
}

/**
 * 摆到某个动作的某一刻。髋部的水平位移：
 *  - keep 是数字：只保留这个比例（倒地这类要挪位置、又不能挪出画面的动作）
 *  - 否则：保留动作自身的重心晃动，只扣掉 from→to 之间的匀速漂移。
 *    这样没勾 In Place 的跑步会变成原地跑，而待机、出招时脚不会在地上打滑。
 */
const anchors = {};
function pose(file, t, keep, from, to, steady) {
  if (current !== file) { mixer.stopAllAction(); actions[file].reset().play(); current = file; }
  const dur = actions[file].getClip().duration;
  from = from ?? 0; to = to ?? dur;
  const key = file + '|' + from + '|' + to;
  let an = anchors[key];
  if (!an) {
    root.position.set(0, 0, 0);
    // 循环动作在恰好等于时长的那一刻会绕回开头，取终点要退一点点
    mixer.setTime(Math.min(to, dur - 1e-3)); const p1 = hips.position.clone();
    mixer.setTime(from); const p0 = hips.position.clone();
    root.updateMatrixWorld(true);
    // 髋部在这一段里的平均朝向：用来压住跑步时过大的左右拧身
    const mean = new THREE.Quaternion(0, 0, 0, 0), q0 = hips.quaternion.clone();
    for (let i = 0; i < 24; i++) {
      mixer.setTime(from + (Math.min(to, dur - 1e-3) - from) * i / 24);
      const q = hips.quaternion; const sgn = q.dot(q0) < 0 ? -1 : 1;
      mean.x += q.x * sgn; mean.y += q.y * sgn; mean.z += q.z * sgn; mean.w += q.w * sgn;
    }
    mean.normalize();
    mixer.setTime(from); root.updateMatrixWorld(true);
    an = anchors[key] = { p0, p1, mean, w: hips.getWorldPosition(new THREE.Vector3()) };
  }
  mixer.setTime(Math.min(t, dur - 1e-3));
  if (typeof keep === 'number') {
    hips.position.x = an.p0.x + (hips.position.x - an.p0.x) * keep;
    hips.position.z = an.p0.z + (hips.position.z - an.p0.z) * keep;
  } else {
    const u = to > from ? (t - from) / (to - from) : 0;
    hips.position.x -= (an.p1.x - an.p0.x) * u;
    hips.position.z -= (an.p1.z - an.p0.z) * u;
  }
  if (steady) hips.quaternion.slerp(an.mean, steady);
  // 起始帧的髋部落在原点上方，保证所有动作脚下是同一个位置
  root.position.set(-an.w.x, 0, -an.w.z);
  root.updateMatrixWorld(true);
}

/** 右手握点、兵器朝向（屏幕角度，y 向下）、透视缩短比例 */
function hand() {
  if (!bones.RightHandIndex1 || !bones.RightHandPinky1 || !bones.RightHandMiddle1) return null;
  const g = n => bones[n].getWorldPosition(new THREE.Vector3());
  const idx = g('RightHandIndex1'), pinky = g('RightHandPinky1'), mid = g('RightHandMiddle1'), wrist = g('RightHand');
  const grip = wrist.clone().lerp(mid, 0.75);
  const dir = idx.clone().sub(pinky).normalize();
  const tip = grip.clone().addScaledVector(dir, cfg.height * 0.3);
  const s0 = screen(grip), s1 = screen(tip);
  const full = cfg.height * 0.3 / (2 * cfg.height * cfg.zoom) * cfg.cell;
  const r = x => Math.round(x * 100) / 100;
  return [r(s0[0]), r(s0[1]), r(Math.atan2(s1[1] - s0[1], s1[0] - s0[0])), r(Math.hypot(s1[0] - s0[0], s1[1] - s0[1]) / full)];
}

window.begin = (cols, rows) => { sheet.width = cols * cfg.cell; sheet.height = rows * cfg.cell; };
window.draw = (file, t, keep, col, row, from, to, steady) => {
  pose(file, t, keep, from, to, steady);
  renderer.render(scene, cam);
  const ctx = sheet.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(renderer.domElement, col * cfg.cell, row * cfg.cell, cfg.cell, cfg.cell);
  return hand();
};
// 图集模式：每帧裁掉四周的透明边，最后紧凑排版
const crops = [];
window.capture = (file, t, keep, from, to, steady) => {
  pose(file, t, keep, from, to, steady);
  renderer.render(scene, cam);
  const n = cfg.cell, c = document.createElement('canvas'); c.width = c.height = n;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(renderer.domElement, 0, 0, n, n);
  const d = ctx.getImageData(0, 0, n, n).data;
  let x0 = n, y0 = n, x1 = -1, y1 = -1;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (d[(y * n + x) * 4 + 3] > 2) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) { x0 = y0 = 0; x1 = y1 = 0; }
  crops.push({ c, x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 });
  return hand();
};
window.pack = (maxW) => {
  const PAD = 2, order = crops.map((_, i) => i).sort((a, b) => crops[b].h - crops[a].h);
  let x = PAD, y = PAD, rowH = 0, W = 0;
  const pos = [];
  for (const i of order) {
    const r = crops[i];
    if (x + r.w + PAD > maxW) { x = PAD; y += rowH + PAD; rowH = 0; }
    pos[i] = { x, y }; x += r.w + PAD; rowH = Math.max(rowH, r.h); W = Math.max(W, x);
  }
  const out = document.createElement('canvas'); out.width = W; out.height = y + rowH + PAD;
  const ctx = out.getContext('2d');
  crops.forEach((r, i) => ctx.drawImage(r.c, r.x, r.y, r.w, r.h, pos[i].x, pos[i].y, r.w, r.h));
  return { url: out.toDataURL('image/webp', 0.9), w: out.width, h: out.height, rects: crops.map((r, i) => ({ x: pos[i].x, y: pos[i].y, w: r.w, h: r.h, sx: r.x, sy: r.y })) };
};
window.label = (text, col, row) => { const ctx = sheet.getContext('2d'); ctx.fillStyle = '#ff0'; ctx.font = '14px monospace'; ctx.fillText(text, col * cfg.cell + 4, row * cfg.cell + 16); };
window.finish = (bg) => {
  if (bg) { const c2 = document.createElement('canvas'); c2.width = sheet.width; c2.height = sheet.height; const x = c2.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(sheet, 0, 0); return c2.toDataURL('image/png'); }
  return sheet.toDataURL('image/png');
};
window.ready = true;
</script></body></html>
