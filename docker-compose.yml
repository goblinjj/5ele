# 联机服务部署：只监听本机端口，由 nginx 反代为 wss://5ele.goblin.top/ws
services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: 5ele-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:2567:2567"
    volumes:
      - 5ele-data:/data
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  5ele-data:
